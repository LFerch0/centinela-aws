name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio también aquí: cada job pide solo lo que necesita.
permissions:
  contents: read

# Un push nuevo a un PR cancela la ejecución anterior del mismo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_email_alertas: ${{ secrets.EMAIL_ALERTAS }}
  TF_VAR_url_repositorio: ${{ github.server_url }}/${{ github.repository }}

jobs:
  pruebas:
    name: Pruebas de las Lambdas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  seguridad:
    name: Analisis de seguridad (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install checkov==3.4.5
      - run: checkov -d . --config-file .checkov.yaml --var-file infra/checkov.tfvars

  validar:
    name: Formato y validacion de Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
      - run: terraform fmt -check -recursive
      - name: Validar infra
        working-directory: infra
        run: terraform init -backend=false && terraform validate
      - name: Validar bootstrap
        working-directory: bootstrap
        run: terraform init -backend=false && terraform validate

  plan:
    name: Plan
    # Solo PRs del propio repositorio: los forks y Dependabot no reciben credenciales.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    needs: [pruebas, seguridad, validar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Para pedir el token OIDC a GitHub
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false
      - name: Diagnostico OIDC (temporal)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c '
          import base64, json, sys
          carga = sys.argv[1].split(".")[1]
          carga += "=" * (-len(carga) % 4)
          claims = json.loads(base64.urlsafe_b64decode(carga))
          print(json.dumps({k: claims.get(k) for k in ("sub", "aud", "iss", "repository", "event_name")}, indent=2))
          ' "$TOKEN"
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=infra/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Plan
        # -lock=false: el plan no escribe el estado, así que no necesita bloquearlo
        run: terraform plan -lock=false -no-color -out=tfplan
      - name: Resumen del plan
        run: |
          {
            echo "## Plan de Terraform"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  desplegar:
    name: Apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [pruebas, seguridad, validar]
    runs-on: ubuntu-latest
    environment: produccion # Pausa hasta que una persona aprueba
    concurrency:
      group: produccion
      cancel-in-progress: false # Nunca cortar un apply a la mitad
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=infra/terraform.tfstate"
          -backend-config="region=${{ env.AWS_REGION }}"
          -backend-config="use_lockfile=true"
          -backend-config="encrypt=true"
      - name: Plan
        run: terraform plan -no-color -out=tfplan
      - name: Apply
        # Aplica exactamente el plan anterior, no uno recalculado
        run: terraform apply -no-color tfplan
